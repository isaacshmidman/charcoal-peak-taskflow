services:
  taskflow:
    build:
      context: .
      args:
        - VITE_APP_ID=${TASKFLOW_APP_ID:-69b71a4b57ba76a74090fc6e}
    restart: always
    ports:
      - "${WEBUI_PORT:-8787}:8787"
    volumes:
      # The folder on this machine that holds the database and attachments:
      # TASKFLOW_DATA_DIR in .env. There is deliberately no default. A wrong
      # folder here starts the app on an empty database, which looks exactly
      # like losing everything — so without the setting, every
      # `docker compose` command stops with the message below instead.
      - "${TASKFLOW_DATA_DIR:?Set TASKFLOW_DATA_DIR in .env to the folder that holds the app data - see .env.production.example}:/app/backend/data"
    environment:
      - NODE_ENV=production
      - TASKFLOW_APP_ID=${TASKFLOW_APP_ID:-69b71a4b57ba76a74090fc6e}
      - TASKFLOW_PUBLIC_APP_URL=${TASKFLOW_PUBLIC_APP_URL:-https://zephyrly.app}
      - TASKFLOW_SESSION_SECRET=${TASKFLOW_SESSION_SECRET}
      - TASKFLOW_GOOGLE_CLIENT_ID=${TASKFLOW_GOOGLE_CLIENT_ID}
      - TASKFLOW_GOOGLE_CLIENT_SECRET=${TASKFLOW_GOOGLE_CLIENT_SECRET}
      - TASKFLOW_GOOGLE_REDIRECT_URL=${TASKFLOW_GOOGLE_REDIRECT_URL:-https://zephyrly.app/api/apps/auth/google/callback}
      - INTEGRATIONS_ENCRYPTION_KEY=${INTEGRATIONS_ENCRYPTION_KEY}
      - TASKFLOW_GOOGLE_CALENDAR_CLIENT_ID=${TASKFLOW_GOOGLE_CALENDAR_CLIENT_ID}
      - TASKFLOW_GOOGLE_CALENDAR_CLIENT_SECRET=${TASKFLOW_GOOGLE_CALENDAR_CLIENT_SECRET}
      - TASKFLOW_GOOGLE_CALENDAR_REDIRECT_URL=${TASKFLOW_GOOGLE_CALENDAR_REDIRECT_URL:-https://zephyrly.app/api/apps/69b71a4b57ba76a74090fc6e/integrations/google/callback}
      - TASKFLOW_INTEGRATIONS_ENABLED=${TASKFLOW_INTEGRATIONS_ENABLED:-true}
      - TASKFLOW_SYNC_INTERVAL_MS=${TASKFLOW_SYNC_INTERVAL_MS:-60000}
      - TASKFLOW_VAPID_PUBLIC_KEY=${TASKFLOW_VAPID_PUBLIC_KEY}
      - TASKFLOW_VAPID_PRIVATE_KEY=${TASKFLOW_VAPID_PRIVATE_KEY}
      - TASKFLOW_VAPID_SUBJECT=${TASKFLOW_VAPID_SUBJECT}
      - TASKFLOW_NOTIFICATION_POLL_MS=${TASKFLOW_NOTIFICATION_POLL_MS:-60000}
      - TASKFLOW_ALLOW_ANY_PASSWORD=${TASKFLOW_ALLOW_ANY_PASSWORD:-false}
      - TASKFLOW_DELETED_TASK_RETENTION_DAYS=${TASKFLOW_DELETED_TASK_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      taskflow:
        condition: service_healthy

  # Brings the site back by itself when the tunnel stays disconnected
  # (backend/watchdog/main.js). Checks the public address once a minute.
  # If Cloudflare reports the tunnel down for 5 minutes while this box is
  # online and the app is healthy: restarts the cloudflared container. If
  # that hasn't helped 10 minutes later: restarts the box (a clean
  # `systemctl reboot`), at most once every 6 hours, never twice for the
  # same outage, and never over a cloudflared container that was created
  # or replaced around the time the outage began. Does nothing when the
  # home internet is out, the app itself is down, or cloudflared was
  # stopped on purpose.
  #
  # Start it once:   docker compose up -d --build watchdog
  # What it saw:     /DATA/AppData/taskflow/watchdog/watchdog.log
  # Pause it:        docker compose stop watchdog
  # Rehearse only:   WATCHDOG_DRY_RUN=true in .env (logs, never acts)
  # Tunnel only:     WATCHDOG_ALLOW_BOX_RESTART=false in .env
  watchdog:
    build:
      context: ./backend/watchdog
    restart: always
    # The host's own network, to see what the box itself can reach —
    # separately from Docker's container networking, which may be the
    # thing that's broken. It listens on nothing.
    network_mode: host
    labels:
      - app.zephyrly.watchdog=true
    volumes:
      # To restart the tunnel container and, as the last resort, start
      # the one-off helper that restarts the box.
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/taskflow/watchdog:/state
    environment:
      - WATCHDOG_SITE_URL=${TASKFLOW_PUBLIC_APP_URL:-https://zephyrly.app}/api/health
      - WATCHDOG_LOCAL_URL=http://127.0.0.1:${WEBUI_PORT:-8787}/api/health
      - WATCHDOG_ALLOW_BOX_RESTART=${WATCHDOG_ALLOW_BOX_RESTART:-true}
      - WATCHDOG_DRY_RUN=${WATCHDOG_DRY_RUN:-false}
    # So it can never get in the way of anything else: a memory ceiling,
    # and an eighth of a normal container's CPU priority (it yields to
    # everything). Priority rather than a hard CPU cap, because Docker
    # refuses to start a container with a cap on kernels that lack it.
    mem_limit: 128m
    cpu_shares: 128
    pids_limit: 64
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
