services:
  taskflow:
    build: .
    restart: always
    ports:
      - "${WEBUI_PORT:-8787}:8787"
    volumes:
      - /DATA/AppData/taskflow/data:/app/backend/data
    environment:
      - NODE_ENV=production
      - TASKFLOW_APP_ID=${TASKFLOW_APP_ID:-69b71a4b57ba76a74090fc6e}
      - TASKFLOW_PUBLIC_APP_URL=${TASKFLOW_PUBLIC_APP_URL:-https://peaktaskflow.com}
      - TASKFLOW_SESSION_SECRET=${TASKFLOW_SESSION_SECRET}
      - TASKFLOW_GOOGLE_CLIENT_ID=${TASKFLOW_GOOGLE_CLIENT_ID}
      - TASKFLOW_GOOGLE_CLIENT_SECRET=${TASKFLOW_GOOGLE_CLIENT_SECRET}
      - TASKFLOW_GOOGLE_REDIRECT_URL=${TASKFLOW_GOOGLE_REDIRECT_URL:-https://peaktaskflow.com/api/apps/auth/google/callback}
      - TASKFLOW_ALLOW_ANY_PASSWORD=${TASKFLOW_ALLOW_ANY_PASSWORD:-false}
      - TASKFLOW_DELETED_TASK_RETENTION_DAYS=${TASKFLOW_DELETED_TASK_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      taskflow:
        condition: service_healthy
