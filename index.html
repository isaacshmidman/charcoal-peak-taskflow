<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/zephyrly-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zephyrly" />
    <meta name="theme-color" content="#fff5a6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The typeface, fetched alongside the page rather than after the
         stylesheet asks for it, so text doesn't start in a fallback and swap. -->
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Zephyrly</title>
    <!-- Apply the user's saved appearance BEFORE React mounts so the page
         doesn't flash light-then-dark (FOUC) on cold loads. Mirrors the
         logic in src/lib/ThemeProvider.jsx but inlined and synchronous. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("appearance") || "system";
          var dark = v === "dark" ||
            (v === "system" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", "#2e2a0e");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      /* Paints the page wash before any stylesheet loads, so these MUST
         stay literal hex. The real values are --wash-light / --wash-dark
         in src/styles/zephyrly.css — change both together. */
      html {
        min-height: 100%;
        background: #fff5a6;
        color-scheme: light;
      }

      html.dark {
        background: #2e2a0e;
        color-scheme: dark;
      }

      body,
      #root {
        min-height: 100vh;
      }

      body {
        margin: 0;
        background: #fafaf7 linear-gradient(180deg, #fff5a6 0, #fffad8 110px, #fafaf7 300px) no-repeat;
      }

      html.dark body {
        background: #131311 linear-gradient(180deg, #2e2a0e 0, #1e1c10 110px, #131311 300px) no-repeat;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
