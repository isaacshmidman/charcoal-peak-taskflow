<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/zephyrly-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zephyrly" />
    <meta name="theme-color" content="#f5f5a0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Zephyrly</title>
    <!-- Apply the user's saved appearance BEFORE React mounts so the page
         doesn't flash light-then-dark (FOUC) on cold loads. Mirrors the
         logic in src/lib/ThemeProvider.jsx but inlined and synchronous. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("appearance") || "light";
          var dark = v === "dark" ||
            (v === "system" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var theme = document.querySelector('meta[name="theme-color"]');
            if (theme) theme.setAttribute("content", "#000000");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      html {
        min-height: 100%;
        background: radial-gradient(circle at 100% 100%, #f5f5a0 0%, #fdfdcf 12%, #ffffff 40%);
        color-scheme: light;
      }

      html.dark {
        background: radial-gradient(circle at 100% 100%, rgba(245, 245, 160, 0.18) 0%, rgba(245, 245, 160, 0.07) 18%, #000000 48%, #000000 100%);
        color-scheme: dark;
      }

      body,
      #root {
        min-height: 100vh;
      }

      body {
        margin: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
