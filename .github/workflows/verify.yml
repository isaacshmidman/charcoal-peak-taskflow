name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    # Pinned: `ubuntu-latest` moved to Ubuntu 26 in October 2026, and this
    # Playwright can't install its browser's system packages there yet.
    # Move to a newer image together with a Playwright that supports it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  e2e:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e
